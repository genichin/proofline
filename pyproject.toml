[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofline"
version = "0.1.0"
description = "ProofLine artifact validator"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
proofline = "proofline.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/proofline"]
