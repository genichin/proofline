[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofline"
version = "0.2.0"
description = "ProofLine artifact validator"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/genichin/proofline"
Releases = "https://github.com/genichin/proofline/releases"

[project.scripts]
proofline = "proofline.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/proofline"]

[tool.hatch.build.targets.wheel.force-include]
"templates/schema-v1" = "proofline_schema_v1_templates"
