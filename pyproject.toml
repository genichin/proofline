[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofline"
version = "0.8.0"
description = "ProofLine artifact validator"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/genichin/proofline"
Releases = "https://github.com/genichin/proofline/releases"

[project.scripts]
proofline = "proofline.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "candidate_build_only: packaging test executed only by the optional project-local candidate build job",
]

[tool.hatch.build.targets.sdist]
exclude = ["/AGENTS.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/proofline", "src/proofline_resources", "skills"]

[tool.hatch.build.targets.wheel.force-include]
"templates/schema-v1" = "proofline_schema_v1_templates"
"docs/contracts" = "proofline_resources/contracts"
"templates" = "proofline_resources/templates"
"docs/operations" = "proofline_resources/operations"
