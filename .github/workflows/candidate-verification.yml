name: Candidate verification

on:
  push:
    branches:
      - 'candidate/**'

permissions:
  contents: read
  actions: read

env:
  PROOFLINE_CLEAN_RUNNER_PLAN_ID: candidate-clean-runner-v1
  PROOFLINE_CLEAN_RUNNER_PLAN_RESOURCE: .github/resources/candidate-clean-runner-plan-v1.json
  PROOFLINE_CLEAN_RUNNER_STEP_ORDER: verify-wheel,verify-checksum,create-environment,install-candidate,provision-test-dependencies,contract-probe
  PROOFLINE_CLEAN_RUNNER_ENDPOINT: https://pypi.org/simple
  PROOFLINE_CLEAN_RUNNER_VERSION_SOURCE: uv.lock
  PROOFLINE_CLEAN_RUNNER_NETWORK_MODE: online-offline
  PROOFLINE_CLEAN_RUNNER_PUBLICATION_PREREQUISITE: 'none'

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact candidate HEAD
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Build exact candidate wheel
        shell: bash
        run: |
          CONTAINMENT="$RUNNER_TEMP/proofline-build-state"
          mkdir -p "$CONTAINMENT/cache" "$CONTAINMENT/env" "$CONTAINMENT/tmp" "$CONTAINMENT/basetemp"
          export PYTHONDONTWRITEBYTECODE=1
          export UV_CACHE_DIR="$CONTAINMENT/cache"
          export UV_PROJECT_ENVIRONMENT="$CONTAINMENT/env"
          export TMPDIR="$CONTAINMENT/tmp" TEMP="$CONTAINMENT/tmp" TMP="$CONTAINMENT/tmp"
          git status --short --untracked-files=all > "$CONTAINMENT/tracked-before"
          git status --short --ignored --untracked-files=all > "$CONTAINMENT/ignored-before"
          mkdir -p "$RUNNER_TEMP/proofline-candidate"
          uv build --wheel --out-dir "$RUNNER_TEMP/proofline-candidate"
          cd "$RUNNER_TEMP/proofline-candidate"
          wheel=$(find . -maxdepth 1 -name 'proofline-*.whl' -type f)
          test "$(printf '%s\n' "$wheel" | sed '/^$/d' | wc -l)" -eq 1
          wheel_name=${wheel#./}
          digest=$(sha256sum "$wheel_name" | cut -d ' ' -f1)
          digest=${digest,,}
          printf '%s  %s\n' "$digest" "$wheel_name" > SHA256SUMS
          python - <<'PY'
          import json, os
          from pathlib import Path
          wheel = next(Path('.').glob('proofline-*.whl'))
          digest = __import__('hashlib').sha256(wheel.read_bytes()).hexdigest()
          artifact = f"proofline-candidate-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          Path('CANDIDATE_PROVENANCE.json').write_text(json.dumps({
              'schema_version': 1, 'candidate_sha': os.environ['GITHUB_SHA'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflow_path': '.github/workflows/candidate-verification.yml',
              'artifact_name': artifact, 'wheel_filename': wheel.name,
              'wheel_sha256': digest}, sort_keys=True) + '\n')
          PY
          sha256sum --check --strict SHA256SUMS
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          wheel = next(Path('.').glob('proofline-*.whl')).resolve()
          provenance = json.loads(Path('CANDIDATE_PROVENANCE.json').read_text())
          assert provenance['wheel_filename'] == wheel.name
          assert provenance['wheel_sha256'] == hashlib.sha256(wheel.read_bytes()).hexdigest()
          PY
          WHEEL=$(realpath "$wheel_name")
          uv venv --python 3.11 "$RUNNER_TEMP/proofline-wheel-env"
          uv pip install --python "$RUNNER_TEMP/proofline-wheel-env/bin/python" "$WHEEL"
          cd "$GITHUB_WORKSPACE"
          export PROOFLINE_HOSTED_CANDIDATE_MODE=1
          export PROOFLINE_HOSTED_CANDIDATE_WHEEL="$WHEEL"
          export PROOFLINE_HOSTED_CANDIDATE_WHEEL_SHA256="$digest"
          export PROOFLINE_INSTALLED_EXECUTABLE="$RUNNER_TEMP/proofline-wheel-env/bin/proofline"
          uv run pytest -q -m candidate_build_only --basetemp "$CONTAINMENT/basetemp" -p no:cacheprovider
          git status --short --untracked-files=all > "$CONTAINMENT/tracked-after"
          git status --short --ignored --untracked-files=all > "$CONTAINMENT/ignored-after"
          cmp "$CONTAINMENT/tracked-before" "$CONTAINMENT/tracked-after"
          cmp "$CONTAINMENT/ignored-before" "$CONTAINMENT/ignored-after"
      - uses: actions/upload-artifact@v4
        with:
          name: proofline-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proofline-candidate/
          if-no-files-found: error
          retention-days: 14

  ubuntu-python311:
    runs-on: ubuntu-latest
    needs: build-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact candidate HEAD
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: proofline-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proofline-candidate
      - name: Verify exact wheel and source candidate
        shell: bash
        run: |
          CONTAINMENT="$RUNNER_TEMP/proofline-ubuntu-state"
          mkdir -p "$CONTAINMENT/cache" "$CONTAINMENT/env" "$CONTAINMENT/tmp" "$CONTAINMENT/basetemp" "$CONTAINMENT/pycache"
          export PYTHONDONTWRITEBYTECODE=1
          export UV_CACHE_DIR="$CONTAINMENT/cache"
          export UV_PROJECT_ENVIRONMENT="$CONTAINMENT/env"
          export TMPDIR="$CONTAINMENT/tmp" TEMP="$CONTAINMENT/tmp" TMP="$CONTAINMENT/tmp"
          git status --short --untracked-files=all > "$CONTAINMENT/tracked-before"
          git status --short --ignored --untracked-files=all > "$CONTAINMENT/ignored-before"
          cd "$RUNNER_TEMP/proofline-candidate"
          sha256sum --check --strict SHA256SUMS
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          provenance = json.loads(Path('CANDIDATE_PROVENANCE.json').read_text())
          wheel = next(Path('.').glob('proofline-*.whl'))
          expected = {
              'schema_version': 1, 'candidate_sha': os.environ['GITHUB_SHA'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflow_path': '.github/workflows/candidate-verification.yml',
              'artifact_name': f"proofline-candidate-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
              'wheel_filename': wheel.name,
              'wheel_sha256': hashlib.sha256(wheel.read_bytes()).hexdigest(),
          }
          assert provenance == expected
          PY
          uv venv --python 3.11 "$RUNNER_TEMP/proofline-wheel-env"
          uv pip install --python "$RUNNER_TEMP/proofline-wheel-env/bin/python" proofline-*.whl
          WHEEL=$(realpath proofline-*.whl)
          digest=$(sha256sum "$WHEEL" | cut -d ' ' -f1)
          digest=${digest,,}
          cd "$GITHUB_WORKSPACE"
          git fetch --no-tags origin +refs/heads/main:refs/heads/main
          export PROOFLINE_HOSTED_CANDIDATE_MODE=1
          export PROOFLINE_INSTALLED_EXECUTABLE="$RUNNER_TEMP/proofline-wheel-env/bin/proofline"
          export PROOFLINE_HOSTED_CANDIDATE_WHEEL="$WHEEL"
          export PROOFLINE_HOSTED_CANDIDATE_WHEEL_SHA256="$digest"
          PYTHONPATH=src uv run proofline validate
          "$PROOFLINE_INSTALLED_EXECUTABLE" validate
          export PYTHONPYCACHEPREFIX="$CONTAINMENT/pycache"
          python -m compileall -q src tests
          uv run pytest -q -m "not candidate_build_only" --basetemp "$CONTAINMENT/basetemp" -p no:cacheprovider
          git status --short --untracked-files=all > "$CONTAINMENT/tracked-after"
          git status --short --ignored --untracked-files=all > "$CONTAINMENT/ignored-after"
          cmp "$CONTAINMENT/tracked-before" "$CONTAINMENT/tracked-after"
          cmp "$CONTAINMENT/ignored-before" "$CONTAINMENT/ignored-after"

  windows-python311:
    runs-on: windows-latest
    needs: build-candidate
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact candidate HEAD
        shell: pwsh
        run: if ((git rev-parse HEAD) -ne "${{ github.sha }}") { throw 'candidate HEAD drift' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: proofline-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\proofline-candidate
      - name: Run tracked Windows candidate gate
        shell: powershell
        run: |
          # Contract: package skill inventory and local no-mutation status are verified by the tracked gate.
          $Containment = Join-Path $env:RUNNER_TEMP "proofline-windows-gate-state"
          $env:PYTHONDONTWRITEBYTECODE = "1"
          $env:UV_CACHE_DIR = Join-Path $Containment "cache"
          $env:UV_PROJECT_ENVIRONMENT = Join-Path $Containment "env"
          $env:TMPDIR = Join-Path $Containment "tmp"
          $env:TEMP = $env:TMPDIR
          $env:TMP = $env:TMPDIR
          New-Item -ItemType Directory -Force -Path $env:UV_CACHE_DIR,$env:UV_PROJECT_ENVIRONMENT,$env:TMPDIR | Out-Null
          $TrackedBefore = (& git status --short --untracked-files=all | Out-String)
          $IgnoredBefore = (& git status --short --ignored --untracked-files=all | Out-String)
          $wheel = Get-ChildItem -LiteralPath "${{ runner.temp }}\proofline-candidate" -Filter "proofline-*.whl" -File
          if ($wheel.Count -ne 1) { throw "expected exactly one candidate wheel" }
          $checksum = "${{ runner.temp }}\proofline-candidate\SHA256SUMS"
          $wheelHash = (Get-FileHash -LiteralPath $wheel[0].FullName -Algorithm SHA256).Hash
          if ([string]::IsNullOrWhiteSpace($wheelHash)) { throw 'candidate wheel digest unavailable' }
          & .github/scripts/verify-windows-candidate.ps1 -WheelPath $wheel[0].FullName -ChecksumPath $checksum
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((& git status --short --untracked-files=all | Out-String) -cne $TrackedBefore) { throw "tracked repository mutation" }
          if ((& git status --short --ignored --untracked-files=all | Out-String) -cne $IgnoredBefore) { throw "ignored repository mutation" }
      - name: Verify source and installed wheel regressions
        shell: pwsh
        run: |
          $Containment = Join-Path $env:RUNNER_TEMP "proofline-windows-regression-state"
          $env:PYTHONDONTWRITEBYTECODE = "1"
          $env:UV_CACHE_DIR = Join-Path $Containment "cache"
          $env:UV_PROJECT_ENVIRONMENT = Join-Path $Containment "env"
          $env:TMPDIR = Join-Path $Containment "tmp"
          $env:TEMP = $env:TMPDIR
          $env:TMP = $env:TMPDIR
          $env:PYTHONPYCACHEPREFIX = Join-Path $Containment "pycache"
          New-Item -ItemType Directory -Force -Path $env:UV_CACHE_DIR,$env:UV_PROJECT_ENVIRONMENT,$env:TMPDIR,$env:PYTHONPYCACHEPREFIX | Out-Null
          $TrackedBefore = (& git status --short --untracked-files=all | Out-String)
          $IgnoredBefore = (& git status --short --ignored --untracked-files=all | Out-String)
          $artifact = "$env:RUNNER_TEMP\proofline-candidate"
          $wheel = @(Get-ChildItem -LiteralPath $artifact -Filter "proofline-*.whl" -File)
          if ($wheel.Count -ne 1) { throw "expected exactly one candidate wheel" }
          $provenance = Get-Content -LiteralPath (Join-Path $artifact "CANDIDATE_PROVENANCE.json") -Raw | ConvertFrom-Json
          $expectedArtifact = "proofline-candidate-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $digest = (Get-FileHash -LiteralPath $wheel[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($provenance.schema_version -ne 1 -or
              $provenance.candidate_sha -cne $env:GITHUB_SHA -or
              $provenance.run_id -ne [int64]$env:GITHUB_RUN_ID -or
              $provenance.run_attempt -ne [int]$env:GITHUB_RUN_ATTEMPT -or
              $provenance.workflow_path -cne ".github/workflows/candidate-verification.yml" -or
              $provenance.artifact_name -cne $expectedArtifact -or
              $provenance.wheel_filename -cne $wheel[0].Name -or
              $provenance.wheel_sha256 -cne $digest) { throw "candidate provenance mismatch" }
          uv venv --python 3.11 "$env:RUNNER_TEMP\proofline-wheel-env"
          uv pip install --python "$env:RUNNER_TEMP\proofline-wheel-env\Scripts\python.exe" $wheel[0].FullName
          $env:PROOFLINE_HOSTED_CANDIDATE_MODE = "1"
          $env:PROOFLINE_INSTALLED_EXECUTABLE = "$env:RUNNER_TEMP\proofline-wheel-env\Scripts\proofline.exe"
          $env:PROOFLINE_HOSTED_CANDIDATE_WHEEL = $wheel[0].FullName
          $env:PROOFLINE_HOSTED_CANDIDATE_WHEEL_SHA256 = $digest.ToLowerInvariant()
          uv run pytest -q tests/test_line_init.py tests/test_artifact_validation.py tests/test_cli.py --basetemp (Join-Path $Containment "basetemp") -p no:cacheprovider
          python -m compileall -q src tests
          if ((& git status --short --untracked-files=all | Out-String) -cne $TrackedBefore) { throw "tracked repository mutation" }
          if ((& git status --short --ignored --untracked-files=all | Out-String) -cne $IgnoredBefore) { throw "ignored repository mutation" }
