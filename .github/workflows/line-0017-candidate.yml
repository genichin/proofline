name: Line 0017 candidate verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Build exact candidate wheel
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/proofline-candidate"
          uv build --wheel --out-dir "$RUNNER_TEMP/proofline-candidate"
          cd "$RUNNER_TEMP/proofline-candidate"
          sha256sum proofline-*.whl | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: proofline-candidate
          path: ${{ runner.temp }}/proofline-candidate/
          if-no-files-found: error

  ubuntu-python311:
    runs-on: ubuntu-latest
    needs: build-candidate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: proofline-candidate
          path: ${{ runner.temp }}/proofline-candidate
      - name: Verify exact wheel outside checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP/proofline-candidate"
          sha256sum --check --strict SHA256SUMS
          uv venv --python 3.11 "$RUNNER_TEMP/proofline-wheel-env"
          uv pip install --python "$RUNNER_TEMP/proofline-wheel-env/bin/python" proofline-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/proofline-wheel-env/bin/python" -I -c "from importlib.metadata import version; from pathlib import Path; import proofline; p=Path(proofline.__file__).resolve(); print(version('proofline'), p); assert 'site-packages' in p.parts"
          "$RUNNER_TEMP/proofline-wheel-env/bin/proofline" --version
      - name: Canonical source validation and full regression
        shell: bash
        run: |
          PYTHONPATH=src uv run proofline validate
          python -m compileall -q src tests
          uv run pytest -q
      - name: Linux home transaction regression
        shell: bash
        run: uv run pytest -q tests/test_home_init.py tests/test_home_update.py

  windows-python311:
    runs-on: windows-latest
    needs: build-candidate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: proofline-candidate
          path: ${{ runner.temp }}\proofline-candidate
      - name: Run tracked Windows candidate gate
        shell: powershell
        run: |
          $wheel = Get-ChildItem -LiteralPath "${{ runner.temp }}\proofline-candidate" -Filter "proofline-*.whl" -File
          if ($wheel.Count -ne 1) { throw "expected exactly one candidate wheel" }
          $checksum = "${{ runner.temp }}\proofline-candidate\SHA256SUMS"
          & .github/scripts/verify-windows-candidate.ps1 -WheelPath $wheel[0].FullName -ChecksumPath $checksum
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
